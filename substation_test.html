<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRID LAB | 変電所サイバー演習</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#e5eefb;font-family:system-ui,'Segoe UI',sans-serif}header{padding:18px 25px;background:#111c32;border-bottom:1px solid #263a59;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px;color:#63e6be}small,.muted{color:#95a9c5}.wrap{max-width:1250px;margin:auto;padding:24px}.tabs{display:flex;gap:10px;margin-bottom:20px}button{background:#203654;color:white;border:1px solid #385679;border-radius:8px;padding:11px 17px;cursor:pointer}button:hover,.active{background:#176b83;border-color:#53d9d0}.layout{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}.panel{background:#121e33;border:1px solid #293d5c;border-radius:12px;padding:20px;margin-bottom:18px}h2{font-size:18px;margin-top:0}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{background:#0b1729;padding:15px;border-radius:9px}.metric strong{display:block;font-size:22px;color:#63e6be;margin-top:8px}.terminal{height:300px;overflow:auto;background:#050b12;border-radius:8px;padding:15px;font:14px/1.7 Consolas,monospace;white-space:pre-wrap;color:#a5f3c6}.command{display:flex;gap:8px;margin-top:10px}input{flex:1;background:#081423;border:1px solid #385679;border-radius:7px;color:white;padding:12px;font:14px Consolas,monospace;min-width:0}.mission{border-left:3px solid #48cbb4;padding-left:13px;margin:14px 0}.mission.done{border-color:#f5c96b}.log{font:13px/1.8 Consolas,monospace;background:#091527;padding:12px;border-radius:8px;min-height:115px;white-space:pre-wrap}.hidden{display:none}.tag{color:#f6c66d}@media(max-width:800px){.layout{grid-template-columns:1fr}.metric{grid-template-columns:1fr}header{display:block}}</style></head><body><header><h1>⚡ GRID LAB <small> / SUBSTATION CYBER RANGE</small></h1><span class="muted">● OFFLINE SIMULATION | 架空環境</span></header><main class="wrap"><div class="tabs"><button id="attackTab" class="active" onclick="mode('attack')">攻撃者モード</button><button id="defendTab" onclick="mode('defend')">防御者モード</button><button onclick="resetLab()">演習リセット</button></div><div class="layout"><section><div class="panel"><h2>変電所ステータス</h2><div class="metric"><div>母線電圧<strong>66.0 kV</strong></div><div>周波数<strong>50.0 Hz</strong></div><div>設備状態<strong id="status">正常</strong></div></div><p class="muted">※表示値は固定のダミーデータです。</p></div><div class="panel"><h2 id="missionTitle">攻撃者ミッション</h2><div id="missions"></div><p id="progress" class="tag"></p></div></section><section><div class="panel"><h2>仮想ターミナル</h2><div id="terminal" class="terminal"></div><form class="command" onsubmit="run(event)"><input id="cmd" autocomplete="off" placeholder="help と入力"><button>実行</button></form></div><div class="panel"><h2>セキュリティイベント</h2><div id="logs" class="log"></div></div></section></div></main><script>let current='attack',steps={attack:0,defend:0},blocked=false;const tasks={attack:[['ネットワークを調査','scan'],['公開サービスを確認','inspect web'],['模擬監査レポートを取得','report']],defend:[['イベントを確認','logs'],['不審な送信元を調査','investigate 10.10.0.99'],['模擬IPをブロック','block 10.10.0.99']]};const $=id=>document.getElementById(id);function print(s){$('terminal').textContent+='\n'+s;$('terminal').scrollTop=$('terminal').scrollHeight}function draw(){ $('missionTitle').textContent=current==='attack'?'攻撃者ミッション':'防御者ミッション';$('missions').innerHTML=tasks[current].map((t,i)=>`<div class="mission ${i<steps[current]?'done':''}">${i<steps[current]?'✓':i===steps[current]?'▶':'○'} STEP ${i+1}：${t[0]}<br><small>コマンド: ${t[1]}</small></div>`).join('');$('progress').textContent=steps[current]===3?'🎉 全ミッションクリア！':`進捗 ${steps[current]}/3`;$('attackTab').classList.toggle('active',current==='attack');$('defendTab').classList.toggle('active',current==='defend');$('status').textContent=blocked?'保護中':'正常';$('logs').textContent='[09:00:00] INFO  監視システム起動\n[09:02:15] INFO  センサー正常\n[09:04:22] WARN  10.10.0.99 から不審なアクセス'+(blocked?'\n[09:05:10] INFO  10.10.0.99 を模擬遮断':'')}function mode(m){current=m;$('terminal').textContent='';print('GRID LAB / '+(m==='attack'?'ATTACK':'DEFENSE')+' MODE\nhelp でコマンド一覧を表示');draw()}function run(e){e.preventDefault();const c=$('cmd').value.trim().toLowerCase();$('cmd').value='';if(!c)return;print('lab> '+c);let out='不明なコマンドです。help を参照してください。';const responses={help:'共通: help, clear, status\n攻撃者: scan, inspect web, report\n防御者: logs, investigate 10.10.0.99, block 10.10.0.99',status:'変電所: '+(blocked?'保護中':'正常')+' / 模擬設備 / 実ネットワーク接続なし',scan:'[SIMULATED SCAN]\n10.10.0.10  web-console  TCP/443 OPEN\n10.10.0.20  historian    TCP/443 OPEN\n実際のパケットは送信していません。','inspect web':'[SIMULATED SERVICE]\nweb-console v1.0 / 教育用モック\n監査メモ: アクセス制御の設定確認が必要です。',report:'[SIMULATED REPORT]\nFinding: アクセス制御の改善余地\nRisk: MEDIUM\nRecommendation: MFAと権限最小化を実施',logs:'[SIMULATED SIEM]\nWARN 10.10.0.99 認証失敗 5回\nINFO 10.10.0.15 通常アクセス', 'investigate 10.10.0.99':'[SIMULATED INVESTIGATION]\n10.10.0.99: 架空の不審IP\n認証失敗が短時間に集中。隔離を推奨。','block 10.10.0.99':'[SIMULATED FIREWALL]\n10.10.0.99 を模擬ブロックしました。'};if(c==='clear'){$('terminal').textContent='';return}if(responses[c])out=responses[c];if((current==='attack'&&['logs','investigate 10.10.0.99','block 10.10.0.99'].includes(c))||(current==='defend'&&['scan','inspect web','report'].includes(c)))out='このコマンドは反対側のモード専用です。';print(out);if(c===tasks[current][steps[current]]?.[1]){steps[current]++;print('✓ ミッション達成！')}if(c==='block 10.10.0.99'&&current==='defend')blocked=true;draw()}function resetLab(){steps={attack:0,defend:0};blocked=false;mode(current)}mode('attack');</script></body></html>
